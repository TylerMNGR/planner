<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="300"> 
    <title>Workshop Dashboard - Blu Computers</title>
    <style>
        :root { 
            --primary-bg: #1a365d; 
            --accent-orange: #ff8c00; 
            --card-white: #ffffff; 
            --text-dark: #1e293b; 
            --border: #e2e8f0; 
            --vor-red: #dc2626; 
            --ann-blue: #2563eb; 
        }
        
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--primary-bg); 
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding: 10px;
            box-sizing: border-box;
        }

        .top-branding { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr 1fr; 
            align-items: center; 
            color: white; 
            padding: 5px 15px; 
            flex-shrink: 0; 
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-area img { height: 50px; border-radius: 4px; background: white; padding: 2px; }
        .main-title { text-align: center; font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .live-clock { text-align: right; font-weight: 800; font-size: 1.1rem; line-height: 1.2; }
        
        #sync-status { font-size: 0.7rem; }
        .sync-green { color: #4ade80; }
        .sync-orange { color: #fbbf24; }

        .admin-btn {
            display: inline-block;
            margin-top: 3px;
            padding: 3px 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 4px;
            font-size: 9px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .notices-section {
            flex-shrink: 0;
            width: 100%;
        }
        .global-notice { 
            display: flex; 
            align-items: center; 
            padding: 12px 20px; 
            border-radius: 8px; 
            color: white; 
            margin-bottom: 8px; 
            font-weight: bold; 
            font-size: 1.2rem; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
        .vor-bar { background: var(--vor-red); border-left: 15px solid #880000; }
        .ann-bar { background: var(--ann-blue); border-left: 15px solid #003399; }
        .notice-content { flex-grow: 1; margin: 0 20px; }
        
        .edit-notice-btn { 
            background: rgba(255,255,255,0.2); 
            border: 1px solid white; 
            color: white; 
            padding: 5px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 12px; 
        }

        .calendar-grow-container {
            flex-grow: 1; 
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 10px;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }

        header { 
            display: flex; 
            justify-content: center; 
            gap: 15px;
            background: rgba(255,255,255,0.1); 
            padding: 10px; 
            border-radius: 12px; 
            flex-shrink: 0;
        }

        .orange-btn { 
            padding: 10px 25px; 
            border-radius: 6px; 
            font-weight: 800; 
            font-size: 1rem; 
            background: var(--accent-orange); 
            color: white; 
            text-decoration: none; 
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="top-branding">
        <div class="logo-area">
            <img src="https://www.blucomputers.co.uk/gallery_gen/cd6f202757dcc4e33c805062d83679ca_fit.png?ts=1766441461" alt="Logo">
            <div>
                <div style="font-weight: 900;">Blu Computers</div>
                <span id="sync-status" class="sync-green">● Connected</span>
                <br>
                <button class="admin-btn" onclick="accessAdmin()">Admin</button>
            </div>
        </div>
        <div class="main-title">Workshop Portal</div>
        <div id="clock" class="live-clock">...</div>
    </div>

    <div class="notices-section">
        <div class="global-notice ann-bar">
            <strong>ANNOUNCEMENTS:</strong>
            <div class="notice-content" id="ann-text">Loading...</div>
            <button class="edit-notice-btn" onclick="editGlobal('ann')">EDIT</button>
        </div>
        <div class="global-notice vor-bar">
            <strong>VOR NOTICE:</strong>
            <div class="notice-content" id="vor-text">Loading...</div>
            <button class="edit-notice-btn" onclick="editGlobal('vor')">EDIT</button>
        </div>
    </div>

    <div class="calendar-grow-container">
        <iframe src="https://calendar.online/f7a7fdb00caf9bd5fb7b?iframe=true"></iframe>
    </div>

    <header>
        <a href="https://tylermngr.github.io/GTT/" class="orange-btn" target="_blank">Open Job Card</a>
        <a href="https://script.google.com/macros/s/AKfycbzCQ2ogS25WDnRIrSLTOEknviNPgzYlWSNDUqTB6FZovnXXE4PsoTsrnQXtGfoVc-g9gA/exec" class="orange-btn" target="_blank">PCV Inspection</a>
         <a href="https://tylermngr.github.io/WNCTP/" class="orange-btn" target="_blank">LOLER INSPECTION</a>
    </header>
</div>

<script>
    const FIREBASE_BASE = 'https://workshopplanner-c2dfe-default-rtdb.firebaseio.com/';
    const PIN_EDIT = "1984"; 
    const PIN_ADMIN = "0207"; 

    // Automatic Full Page Refresh every 5 minutes
    setTimeout(function(){
       location.reload();
    }, 300000); // 300,000ms = 5 minutes

    function accessAdmin() {
        const pin = prompt("Enter ADMIN PIN:");
        if (pin === PIN_ADMIN) {
            window.open("https://calendar.online/da1306a32194127894de", "_blank");
        } else if (pin !== null) {
            alert("Access Denied.");
        }
    }

    async function loadNotices() {
        const syncLabel = document.getElementById('sync-status');
        try {
            const res = await fetch(FIREBASE_BASE + '.json');
            const data = await res.json();
            document.getElementById('ann-text').innerText = data.globalAnn || "No current announcements";
            document.getElementById('vor-text').innerText = data.globalVor || "No current VORs";
            syncLabel.innerText = "● Connected"; 
            syncLabel.className = "sync-green";
        } catch(e) { 
            syncLabel.innerText = "● Connection Error"; 
            syncLabel.className = "sync-orange"; 
        }
    }

    async function editGlobal(type) {
        const pin = prompt("Enter Admin PIN:");
        if (pin !== PIN_EDIT) return alert("Access Denied.");
        const current = type === 'ann' ? document.getElementById('ann-text').innerText : document.getElementById('vor-text').innerText;
        const newVal = prompt(`Update ${type.toUpperCase()}:`, current);
        if (newVal !== null) {
            const key = type === 'ann' ? 'globalAnn' : 'globalVor';
            await fetch(`${FIREBASE_BASE}${key}.json`, { method: 'PUT', body: JSON.stringify(newVal) });
            loadNotices();
        }
    }

    function updateClock() {
        const now = new Date();
        const day = now.toLocaleDateString('en-GB', { weekday: 'short' });
        const dateNum = now.getDate();
        const month = now.toLocaleDateString('en-GB', { month: 'short' });
        const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        document.getElementById('clock').innerHTML = `${day}, ${dateNum} ${month} ${now.getFullYear()}<br>${time}`;
    }

    setInterval(updateClock, 1000);
    setInterval(loadNotices, 30000);
    updateClock();
    loadNotices();
</script>

</body>
</html>
